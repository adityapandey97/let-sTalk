# =============================================================================
# Let's Talk — Test Environment Configuration (Isolated In-Memory H2 DB)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.upload.dir=./target/test-uploads
app.jwt.secret=test_secret_key_at_least_256_bits_length_for_hmac_sha256_security
app.jwt.expiration-hours=24
app.cors.allowed-origins=*
