# Server Configuration
server.port=8080

# Application Name
spring.application.name=lets-talk

# Database Configuration with Production Environment Variable Overrides
# Production: Set DB_URL=jdbc:mysql://localhost:3306/connectchat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Default development: Persistent H2 with MySQL compatibility mode
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/connectchat_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console (available during development at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Multipart / File Upload Limits (Configurable up to 50MB)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.enabled=true

# Upload Storage Directory
app.upload.dir=${FILE_UPLOAD_PATH:./uploads}

# Security, Token & CORS Configuration
app.auth.token-expiry-hours=${AUTH_TOKEN_EXPIRY_HOURS:72}
app.auth.token-secret=${JWT_SECRET:connectchat_production_secret_key_secure_random_seed}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

